<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Ambient — homepage designs</title>
  <link rel="icon" href="/assets/favicon-64.png">
  <style>
    :root { color-scheme: light dark; --bg: #faf8f5; --ink: #1c1a17; --ink-2: #5e5a53; --rule: #1c1a1722; }
    @media (prefers-color-scheme: dark) { :root { --bg: #14120f; --ink: #f4efe6; --ink-2: #b4ada1; --rule: #f4efe622; } }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 48px 22px 80px; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
    main { max-width: 1120px; margin: 0 auto; }
    h1 { font: 600 34px/1.1 Georgia, serif; margin: 0 0 8px; }
    p { color: var(--ink-2); max-width: 680px; }
    h2 { font: 600 13px/1 ui-monospace, Menlo, monospace; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2); margin: 40px 0 12px; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
    a { display: block; min-height: 44px; padding: 14px 16px; border: 1px solid var(--rule); border-radius: 6px; color: var(--ink); text-decoration: none; }
    a:hover { border-color: var(--ink); }
    a strong { display: block; }
    a span { color: var(--ink-2); font-size: 14px; }
    .off { opacity: 0.55; }
  </style>
</head>
<body>
<main>
  <h1>Homepage designs</h1>
  <p>Every design in the homepage's design test. Opening one here only previews it: it isn't stored or counted, and the design this browser was given stays as it was. <a href="/?theme=reset" style="display:inline;padding:0;border:0;min-height:0;text-decoration:underline">Draw a new design for this browser</a>.</p>
  <div id="list"><p>Loading…</p></div>
</main>
<script>
  fetch("/themes/manifest.json").then((r) => r.json()).then((themes) => {
    const sets = { machines: "Machines", opt: "First round", insp: "Second round", culture: "Culture", nature: "Nature", craft: "Craft" };
    const el = (tag, attrs = {}, text) => Object.assign(document.createElement(tag), attrs, text ? { textContent: text } : {});
    const list = document.getElementById("list");
    list.textContent = "";
    for (const [set, title] of Object.entries(sets)) {
      const group = themes.filter((t) => t.set === set);
      if (!group.length) continue;
      list.append(el("h2", {}, `${title} · ${group.length}`));
      const ul = el("ul");
      for (const t of group) {
        const a = el("a", { href: `/?theme=${t.id}`, className: t.off ? "off" : "" });
        a.append(el("strong", {}, t.name + (t.id === "almanac" ? " (default)" : "") + (t.off ? " (off)" : "")), el("span", {}, t.inspiration || ""));
        const li = el("li");
        li.append(a);
        ul.append(li);
      }
      list.append(ul);
    }
  });
</script>
</body>
</html>
