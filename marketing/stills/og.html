<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../site/styles.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #000; }
  .og { position: relative; width: 1200px; height: 630px; color: #f5f5f7; text-align: center; --state: var(--waiting); --glow: var(--waiting); }
  .og::before { content: ""; position: absolute; left: 50%; top: 20px; width: 1000px; height: 460px; transform: translateX(-50%);
    background: radial-gradient(closest-side, var(--waiting), transparent 70%); opacity: 0.3; filter: blur(30px); }
  .og .screen { position: absolute; left: 50%; top: 44px; transform: translateX(-50%); width: 980px; height: 250px; }
  .og .island { width: 470px; }
  .og h1 { position: absolute; left: 0; right: 0; top: 330px; margin: 0; font-size: 74px; line-height: 1.04; letter-spacing: -0.035em; font-weight: 700; }
  .og .by { position: absolute; left: 0; right: 0; bottom: 42px; display: flex; gap: 12px; justify-content: center; align-items: center; font-size: 26px; font-weight: 600; color: #a1a1a6; }
  .og .by img { width: 44px; height: 44px; border-radius: 10px; }
</style></head>
<body>
<div class="og">
  <div class="screen">
    <div class="menubar"><span>Terminal</span><span class="dim">Shell</span><span class="dim">Edit</span><span class="dim">View</span><span class="right"><span class="status-orb"></span><span class="dim">9:41</span></span></div>
    <div class="island open">
      <div class="wings"></div>
      <div class="bloom">
        <span class="orb big pulse"></span>
        <div><div class="title"><span>api-server</span><span class="tag">CLAUDE</span></div><div class="msg">Needs permission · Bash: rm -rf build</div></div>
        <span class="elapsed">2m</span>
      </div>
    </div>
  </div>
  <h1>Your Mac, aware of<br>your coding agents.</h1>
  <div class="by"><img src="../../site/assets/icon-256.png" alt="">Ambient · free for macOS · yaml.cafe</div>
</div>
</body></html>
